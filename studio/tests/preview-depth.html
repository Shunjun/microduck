<!doctype html>
<meta charset="utf-8">
<title>Studio mesh occlusion regression</title>
<style>
  body { margin: 24px; font: 14px sans-serif; background: #eef0eb; color: #263329; }
  canvas { width: 400px; height: 400px; display: block; border: 1px solid #bdc7b8; }
  #fixture { position: absolute; left: -1000px; }
  #result { white-space: pre-wrap; max-height: 170px; overflow: auto; }
</style>
<h1>Studio mesh occlusion regression</h1>
<pre id="result">Running…</pre>
<div id="fixture"></div>
<canvas id="actual" aria-label="Actual baked robot mesh"></canvas>
<script type="module">
import { Preview, parseMesh } from '../frontend/src/lib/preview.js?depth-regression-full-v3';

const results = [];
const identity = { p: [0, 0, 0], q: [1, 0, 0, 0] };
const model = {
  bodies: [{ ...identity, parent: -1, joint: -1, axis: [0, 0, 1] }],
  meshes: [
    { vertices: [[-.1, -.2, .13], [.1, .3, .13], [0, .3, .33]], triangles: [[0, 1, 2]] },
    { vertices: [[-.1, .05, .13], [.1, .05, .13], [0, .05, .33]], triangles: [[0, 1, 2]] },
  ],
  parts: [
    { ...identity, body: 0, mesh: 0, rgb: [240, 30, 30] },
    { ...identity, body: 0, mesh: 1, rgb: [30, 30, 240] },
  ],
};

function pixel(canvas, x, y) {
  const gl = canvas.getContext('webgl');
  if (gl) {
    const color = new Uint8Array(4);
    gl.readPixels(x, canvas.height - 1 - y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, color);
    return [...color];
  }
  return [...canvas.getContext('2d').getImageData(x, y, 1, 1).data];
}

function check(name, pass, detail) { results.push({ name, pass, detail }); }

// Same projected triangles, with crossing depth planes. Average-depth sorting cannot
// represent both the red front corner and blue far corner, regardless of draw order.
for (const reverse of [false, true]) {
  const canvas = document.createElement('canvas');
  document.querySelector('#fixture').append(canvas);
  const view = new Preview(canvas);
  view.yaw = 0; view.pitch = 0; view.zoom = 1;
  view.model = { ...model, parts: reverse ? [...model.parts].reverse() : model.parts };
  view.render();
  const scale = 400 * 2.3;
  const sample = x => pixel(canvas,
    Math.floor((200 + x * scale) * canvas.width / 400),
    Math.floor((400 * .53 - .02 * scale) * canvas.height / 400));
  const near = sample(-.07), far = sample(.07);
  check(`near red, reverse=${reverse}`, near[0] > near[2] * 2, near);
  check(`far blue, reverse=${reverse}`, far[2] > far[0] * 2, far);
  if (view.dispose) view.dispose();
}

const actual = new Preview(document.querySelector('#actual'));
actual.model = parseMesh(await (await fetch('../assets/duck.bin')).arrayBuffer());
actual.pose([0, -.0873, -.4579, -.0049, .4530, .3491, .3491, 0, 0, 0, 0, .0873, .4579, .0049, -.4530]);
actual.render();
window.preview = actual;
window.results = results;
document.querySelector('#result').textContent = JSON.stringify(results, null, 2);
document.body.dataset.result = results.every(r => r.pass) ? 'pass' : 'fail';
</script>
